<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHOTA STORE - Carrera de Ventas Anime</title>
    <!-- html2canvas para captura PNG -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@600;700&display=swap');

        * { box-sizing: border-box; }
        body {
            font-family: 'Rajdhani', sans-serif;
            background: #090d16;
            background-image: radial-gradient(#1e1b4b 1px, transparent 0);
            background-size: 24px 24px;
            color: #f1f5f9;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .action-bar {
            width: 100%;
            max-width: 1050px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 12px rgba(0, 0, 0, 0.5);
            transition: all 0.2s ease;
        }

        .btn:hover { transform: translateY(-2px); }
        .btn-download { background: linear-gradient(135deg, #0284c7, #2563eb); color: white; }
        .btn-save { background: linear-gradient(135deg, #059669, #10b981); color: white; }
        .btn-admin { background: linear-gradient(135deg, #d97706, #f59e0b); color: white; }

        .container {
            width: 100%;
            max-width: 1050px;
            background: #0f172a;
            border-radius: 16px;
            padding: 24px;
            border: 2px solid #3b82f6;
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.25);
        }

        .header {
            text-align: center;
            background: linear-gradient(135deg, #1e1b4b, #0f172a);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 2px solid #6366f1;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            box-shadow: inset 0 0 20px rgba(99, 102, 241, 0.3);
            flex-wrap: wrap;
        }

        .main-logo {
            height: 55px;
            object-fit: contain;
            filter: drop-shadow(0 0 8px rgba(239, 68, 68, 0.6));
        }

        .anime-banner {
            display: flex;
            gap: 8px;
            align-items: center;
            background: rgba(15, 23, 42, 0.7);
            padding: 6px 12px;
            border-radius: 30px;
            border: 1px solid #334155;
        }

        .anime-banner img {
            height: 25px;
            object-fit: contain;
        }

        .header-text h1 {
            margin: 0;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            text-transform: uppercase;
            background: linear-gradient(90deg, #38bdf8, #a855f7, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1.5px;
        }

        .date-bar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 15px;
            align-items: center;
            gap: 10px;
        }

        .date-bar input {
            background: #1e293b;
            border: 1px solid #475569;
            color: #38bdf8;
            font-family: 'Orbitron', sans-serif;
            padding: 6px 12px;
            border-radius: 6px;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 8px;
            margin-bottom: 20px;
        }

        th {
            background-color: #1e293b;
            color: #38bdf8;
            font-family: 'Orbitron', sans-serif;
            text-align: left;
            padding: 12px;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 2px solid #334155;
        }

        td {
            background: #182234;
            padding: 10px 12px;
            vertical-align: middle;
        }

        td:first-child { border-radius: 8px 0 0 8px; }
        td:last-child { border-radius: 0 8px 8px 0; }

        .store-cell {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .store-logo-img {
            width: 40px;
            height: 40px;
            object-fit: contain;
            background: #0f172a;
            padding: 3px;
            border-radius: 8px;
            border: 1px solid #3b82f6;
            flex-shrink: 0;
        }

        .store-info {
            display: flex;
            flex-direction: column;
            gap: 3px;
            width: 100%;
        }

        .store-name {
            font-family: 'Orbitron', sans-serif;
            font-weight: 800;
            font-size: 0.9rem;
            color: #f8fafc;
        }

        .input-dark {
            background: #0f172a;
            border: 1px solid #334155;
            color: #f1f5f9;
            padding: 6px 8px;
            border-radius: 6px;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 600;
            font-size: 0.85rem;
            width: 100%;
            transition: all 0.3s ease;
        }

        .input-dark:focus { border-color: #38bdf8; outline: none; }
        .input-dark:disabled { background: #090d16; opacity: 0.6; cursor: not-allowed; }

        /* ILUMINACIÓN GRADUAL DE METAS DIARIAS */
        .meta-low {
            border: 1px solid #f87171 !important;
            box-shadow: 0 0 8px rgba(248, 113, 113, 0.4);
            color: #fca5a5 !important;
        }
        .meta-mid {
            border: 1px solid #facc15 !important;
            box-shadow: 0 0 10px rgba(250, 204, 21, 0.5);
            color: #fef08a !important;
        }
        .meta-complete {
            border: 1px solid #4ade80 !important;
            box-shadow: 0 0 14px rgba(74, 222, 128, 0.8);
            color: #86efac !important;
            font-weight: 800;
        }

        .progress-container {
            width: 100%;
            background-color: #0f172a;
            border-radius: 8px;
            height: 20px;
            overflow: hidden;
            border: 1px solid #334155;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #a855f7, #10b981);
            width: 0%;
            transition: width 0.4s ease;
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.5);
        }

        .pct-text {
            font-family: 'Orbitron', sans-serif;
            font-weight: 800;
            font-size: 0.85rem;
            color: #38bdf8;
            text-align: center;
        }

        .total-box {
            background: linear-gradient(135deg, #1e1b4b, #0f172a);
            border: 2px solid #a855f7;
            color: white;
            padding: 16px 20px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
        }

        .total-box span.amount {
            color: #ec4899;
            font-size: 1.4rem;
            text-shadow: 0 0 10px rgba(236, 72, 153, 0.5);
        }

        .leader-badge {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: white;
            font-size: 0.65rem;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Orbitron';
            margin-left: 6px;
        }
    </style>
</head>
<body>

<div class="action-bar">
    <button class="btn btn-admin" onclick="iniciarSesionAdmin()">
        🔑 Acceso Admin / Desbloquear
    </button>
    <div>
        <button class="btn btn-save" onclick="sincronizarDatos()">
            ⚡ Sincronizar
        </button>
        <button class="btn btn-download" onclick="descargarComoImagen()">
            📸 Captura PNG
        </button>
    </div>
</div>

<div class="container" id="carreraVentas">
    <div class="header">
        <img src="SHOTA.jpg" class="main-logo" alt="Shota Store Logo" onerror="this.src='https://i.imgur.com/vH3y1K1.png';">
        <div class="header-text">
            <h1>⛩️ CARRERA DE VENTAS SHOTA STORE ⛩️</h1>
        </div>
        <div class="anime-banner">
            <img src="naruto.jpeg" alt="Naruto" onerror="this.style.display='none';">
            <img src="one piece.jpg" alt="One Piece" onerror="this.style.display='none';">
            <img src="b67c4674ae69aa5d04b902ae1b934f9e.jpg" alt="Dragon Ball Z" onerror="this.style.display='none';">
            <img src="Kimetsu.png" alt="Demon Slayer" onerror="this.style.display='none';">
            <img src="jijusu.jpeg" alt="Jujutsu Kaisen" onerror="this.style.display='none';">
            <img src="atack on titan.jpeg" alt="Attack on Titan" onerror="this.style.display='none';">
            <img src="pokemon.jpg" alt="Pokemon" onerror="this.style.display='none';">
        </div>
    </div>

    <div class="date-bar">
        <label style="font-family: 'Orbitron'; font-size: 0.8rem; color: #94a3b8;">📅 FECHA DE MONITOREO:</label>
        <input type="date" id="fechaRegistro" onchange="cargarDatosFecha()">
    </div>

    <table>
        <thead>
            <tr>
                <th style="width: 32%;">Punto de Venta / Asesores</th>
                <th style="width: 18%;">Meta Día ($)</th>
                <th style="width: 18%;">Venta Real ($)</th>
                <th style="width: 22%;">Progreso Carrera</th>
                <th style="width: 10%; text-align: center;">%</th>
            </tr>
        </thead>
        <tbody id="tablaSucursales">
            <!-- Cargado Dinámicamente -->
        </tbody>
    </table>

    <div class="total-box">
        <span>⚡ ACUMULADO GENERAL DIARIO:</span>
        <span class="amount" id="granTotal">🔒 OCULTO (SOLO ADMINS)</span>
    </div>
</div>

<script>
    const CLAVE_SUPER_ADMIN = "SUPER123";
    let clavesSubAdmin = ["SUB123"];
    let esAdmin = false;

    // Lista fija de sucursales por orden alfabético
    const sucursales = [
        "SHOTA ALAMEDA 1",
        "SHOTA ALAMEDA 2",
        "SHOTA CUESTA",
        "SHOTA GALERÍAS",
        "SHOTA JILOTEPEC",
        "SHOTA LIBRAMIENTO",
        "SHOTA MISIONES",
        "SHOTA PLAZA JUÁREZ 1",
        "SHOTA PLAZA JUÁREZ 2",
        "SHOTA RÍO",
        "SHOTA SENDERO",
        "SHOTA TORRES 1",
        "SHOTA TORRES 2",
        "SHOTA TORRES 3"
    ];

    // Configuración Firebase
    const firebaseConfig = {
        apiKey: "TU_API_KEY",
        authDomain: "tu-proyecto.firebaseapp.com",
        databaseURL: "https://tu-proyecto-default-rtdb.firebaseio.com",
        projectId: "tu-proyecto",
        storageBucket: "tu-proyecto.appspot.com",
        messagingSenderId: "123456789",
        appId: "1:123456789:web:abcdef"
    };

    let db = null;
    if (firebaseConfig.apiKey !== "TU_API_KEY") {
        firebase.initializeApp(firebaseConfig);
        db = firebase.database();
        escucharFirebase();
    }

    document.getElementById('fechaRegistro').value = new Date().toISOString().slice(0, 10);

    function cargarTabla() {
        const tbody = document.getElementById('tablaSucursales');
        tbody.innerHTML = '';

        sucursales.forEach((sucursal, index) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>
                    <div class="store-cell">
                        <img src="SHOTA.jpg" class="store-logo-img" alt="Logo" onerror="this.src='https://i.imgur.com/vH3y1K1.png';">
                        <div class="store-info">
                            <span class="store-name" id="name-${index}">${sucursal}</span>
                            <input type="text" class="input-dark input-asesores" data-sucursal="${sucursal}" placeholder="👥 Asesor(es) turno..." oninput="transmitirField('${sucursal}', 'asesores', this.value)">
                        </div>
                    </div>
                </td>
                <td>
                    <input type="number" class="input-dark input-meta" id="meta-input-${index}" data-sucursal="${sucursal}" placeholder="Meta $" value="10000" ${!esAdmin ? 'disabled' : ''} oninput="calcularTotales(); transmitirField('${sucursal}', 'meta', this.value);">
                </td>
                <td>
                    <input type="number" class="input-dark input-venta" data-sucursal="${sucursal}" placeholder="0.00" oninput="calcularTotales(); transmitirField('${sucursal}', 'venta', this.value);">
                </td>
                <td>
                    <div class="progress-container">
                        <div class="progress-bar" id="bar-${index}"></div>
                    </div>
                </td>
                <td class="pct-text" id="pct-${index}">0%</td>
            `;
            tbody.appendChild(tr);
        });
        calcularTotales();
    }

    function calcularTotales() {
        const inputsVenta = document.querySelectorAll('.input-venta');
        const inputsMeta = document.querySelectorAll('.input-meta');
        let sumaTotalVentas = 0;
        let maxPct = -1;
        let maxIndex = -1;

        inputsVenta.forEach((inputVenta, index) => {
            const venta = parseFloat(inputVenta.value) || 0;
            const metaInput = inputsMeta[index];
            const meta = (metaInput && parseFloat(metaInput.value)) ? parseFloat(metaInput.value) : 10000;

            sumaTotalVentas += venta;
            let porcentaje = Math.min(Math.round((venta / meta) * 100), 100);
            
            // Determinar Líder
            if (porcentaje > maxPct && venta > 0) {
                maxPct = porcentaje;
                maxIndex = index;
            }

            const bar = document.getElementById(`bar-${index}`);
            const pct = document.getElementById(`pct-${index}`);
            
            if (bar && pct && metaInput) {
                bar.style.width = `${porcentaje}%`;
                pct.innerText = `${porcentaje}%`;

                // ILUMINACIÓN GRADUAL SEGÚN EL AVANCE DE LA META
                metaInput.classList.remove('meta-low', 'meta-mid', 'meta-complete');
                if (porcentaje >= 100) {
                    metaInput.classList.add('meta-complete');
                } else if (porcentaje >= 50) {
                    metaInput.classList.add('meta-mid');
                } else if (venta > 0) {
                    metaInput.classList.add('meta-low');
                }
            }
        });

        // Etiqueta al Punto de Venta que va ganando
        sucursales.forEach((sucursal, idx) => {
            const nameSpan = document.getElementById(`name-${idx}`);
            if (nameSpan) {
                const oldBadge = nameSpan.querySelector('.leader-badge');
                if (oldBadge) oldBadge.remove();

                if (idx === maxIndex) {
                    const badge = document.createElement('span');
                    badge.className = 'leader-badge';
                    badge.innerText = '👑 LÍDER';
                    nameSpan.appendChild(badge);
                }
            }
        });

        // RESTRICCIÓN DE TOTALES (Solo Admins)
        const elemGranTotal = document.getElementById('granTotal');
        if (esAdmin) {
            elemGranTotal.innerText = `$${sumaTotalVentas.toLocaleString('es-MX', {minimumFractionDigits: 2})}`;
        } else {
            elemGranTotal.innerText = "🔒 OCULTO (SOLO ADMINS)";
        }
    }

    function transmitirField(sucursal, campo, valor) {
        if (!db) return;
        const fecha = document.getElementById('fechaRegistro').value;
        db.ref(`ventas_diarias/${fecha}/puntos/${sucursal}/${campo}`).set(valor);
    }

    function iniciarSesionAdmin() {
        const pass = prompt("Introduce Clave de Administrador o Sub-Admin para modificar Metas:");
        if (pass === CLAVE_SUPER_ADMIN || clavesSubAdmin.includes(pass)) {
            esAdmin = true;
            alert("🔓 MODO ADMINISTRADOR ACTIVADO:\n- Edición de Metas Habilitada.\n- Totales Desbloqueados.");
            document.querySelectorAll('.input-meta').forEach(input => input.disabled = false);
        } else if (pass !== null) {
            alert("❌ Clave incorrecta.");
        }
        calcularTotales();
    }

    function escucharFirebase() {
        db.ref('configuracion/sub_admins').on('value', (snapshot) => {
            const sub = snapshot.val();
            if (sub && Array.isArray(sub)) clavesSubAdmin = sub;
        });
        cargarDatosFecha();
    }

    function cargarDatosFecha() {
        if (!db) return;
        const fecha = document.getElementById('fechaRegistro').value;

        db.ref(`ventas_diarias/${fecha}/puntos`).on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                Object.keys(data).forEach(sucursal => {
                    const inputVenta = document.querySelector(`.input-venta[data-sucursal="${sucursal}"]`);
                    const inputMeta = document.querySelector(`.input-meta[data-sucursal="${sucursal}"]`);
                    const inputAsesores = document.querySelector(`.input-asesores[data-sucursal="${sucursal}"]`);
                    
                    if (inputVenta && document.activeElement !== inputVenta) inputVenta.value = data[sucursal].venta || '';
                    if (inputMeta && document.activeElement !== inputMeta) inputMeta.value = data[sucursal].meta || '10000';
                    if (inputAsesores && document.activeElement !== inputAsesores) inputAsesores.value = data[sucursal].asesores || '';
                });
                calcularTotales();
            }
        });
    }

    function descargarComoImagen() {
        const elemento = document.getElementById('carreraVentas');
        html2canvas(elemento, {
            scale: 2,
            backgroundColor: "#090d16",
            onclone: (docClonado) => {
                const origInputs = elemento.querySelectorAll('input');
                const cloneInputs = docClonado.querySelectorAll('input');
                origInputs.forEach((inp, idx) => {
                    if (cloneInputs[idx]) cloneInputs[idx].value = inp.value;
                });
            }
        }).then(canvas => {
            const enlace = document.createElement('a');
            const fecha = document.getElementById('fechaRegistro').value;
            enlace.download = `Carrera_ShotaStore_${fecha}.png`;
            enlace.href = canvas.toDataURL('image/png');
            enlace.click();
        });
    }

    function sincronizarDatos() { alert("⚡ Datos sincronizados en tiempo real."); }

    cargarTabla();
</script>

</body>
</html>
