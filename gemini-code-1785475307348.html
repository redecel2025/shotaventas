<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrera de Ventas - SHOTA STORE</title>
    <!-- Librería html2canvas para la descarga en imagen -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- Firebase SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #1e293b;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .action-bar {
            width: 100%;
            max-width: 950px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.88rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            transition: all 0.2s;
        }

        .btn-download { background-color: #0284c7; color: white; }
        .btn-download:hover { background-color: #0369a1; }
        .btn-save { background-color: #16a34a; color: white; }
        .btn-save:hover { background-color: #15803d; }
        .btn-admin { background-color: #d97706; color: white; }
        .btn-admin:hover { background-color: #b45309; }

        .container {
            width: 100%;
            max-width: 950px;
            background: #ffffff;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .header {
            text-align: center;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            color: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            border-bottom: 4px solid #38bdf8;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .header-logo {
            height: 50px;
            width: 50px;
            object-fit: cover;
            border-radius: 8px;
            border: 2px solid #38bdf8;
        }

        .header-text h1 { margin: 0; font-size: 1.5rem; text-transform: uppercase; letter-spacing: 0.5px; }
        .header-text p { margin: 4px 0 0 0; color: #38bdf8; font-weight: 600; font-size: 0.9rem; }

        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            background: #f1f5f9;
            padding: 14px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 1px solid #e2e8f0;
        }

        .field-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: bold;
            color: #475569;
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        input[type="text"], input[type="number"], input[type="date"] {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 600;
            color: #0f172a;
            background-color: #ffffff;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }

        th {
            background-color: #1e293b;
            color: #f8fafc;
            text-align: left;
            padding: 10px;
            font-size: 0.8rem;
            text-transform: uppercase;
        }

        td {
            padding: 10px;
            border-bottom: 1px solid #e2e8f0;
            vertical-align: middle;
        }

        .store-cell {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .store-logo {
            height: 38px;
            width: 38px;
            object-fit: contain;
            border-radius: 6px;
            background-color: #f8fafc;
            padding: 2px;
            border: 1px solid #cbd5e1;
        }

        .logo-placeholder {
            height: 38px;
            width: 38px;
            border-radius: 6px;
            background-color: #fef3c7;
            border: 1px solid #f59e0b;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.65rem;
            color: #b45309;
            font-weight: bold;
        }

        .store-info {
            display: flex;
            flex-direction: column;
        }

        .store-name {
            font-weight: 700;
            font-size: 0.95rem;
            color: #0f172a;
        }

        .input-asesores {
            font-size: 0.8rem !important;
            padding: 4px 8px !important;
            margin-top: 4px;
            border-color: #e2e8f0 !important;
            background-color: #f8fafc !important;
        }

        .progress-container {
            width: 100%;
            background-color: #e2e8f0;
            border-radius: 8px;
            height: 18px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #d97706, #10b981);
            width: 0%;
            transition: width 0.3s ease;
            border-radius: 8px;
        }

        .pct-text {
            font-weight: bold;
            font-size: 0.85rem;
            color: #1e293b;
            text-align: center;
        }

        .total-box {
            background: #0f172a;
            color: white;
            padding: 16px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .total-box span.amount { color: #38bdf8; font-size: 1.3rem; }

        /* Estilos del Modal de Administración */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: #ffffff;
            padding: 24px;
            border-radius: 12px;
            width: 90%;
            max-width: 550px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .modal-header h3 { margin: 0; color: #0f172a; }

        .btn-close {
            background: transparent;
            border: none;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            color: #64748b;
        }

        .admin-section {
            margin-bottom: 15px;
        }

        .admin-section h4 {
            margin: 0 0 8px 0;
            font-size: 0.9rem;
            color: #475569;
            text-transform: uppercase;
        }

        .admin-list {
            max-height: 180px;
            overflow-y: auto;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            padding: 8px;
            margin-bottom: 10px;
        }

        .admin-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 8px;
            border-bottom: 1px solid #f1f5f9;
        }

        .btn-del {
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 4px 8px;
            font-size: 0.75rem;
            cursor: pointer;
        }

        .add-box {
            display: flex;
            gap: 8px;
        }
    </style>
</head>
<body>

<div class="action-bar">
    <button class="btn btn-admin" onclick="iniciarSesionAdmin()">
        🔑 Acceso Administrador
    </button>
    <div>
        <button class="btn btn-save" onclick="guardarEnFirebase()">
            ☁️ Sincronizar Cambios
        </button>
        <button class="btn btn-download" onclick="descargarComoImagen()">
            📸 Descargar Captura
        </button>
    </div>
</div>

<div class="container" id="carreraVentas">
    <div class="header">
        <img src="SHOTA.jpg" class="header-logo" alt="Shota Logo" onerror="this.src='SHOTA.png'; this.onerror=function(){this.style.display='none';}">
        <div class="header-text">
            <h1>🏁 CARRERA DE VENTAS - SHOTA STORE</h1>
            <p>Monitoreo e Identidad de Puntos de Venta en Tiempo Real</p>
        </div>
    </div>

    <div class="controls-grid">
        <div class="field-group">
            <label>📅 Fecha de Carrera:</label>
            <input type="date" id="fechaRegistro" onchange="cargarDatosFecha()">
        </div>
        <div class="field-group">
            <label>🎯 Meta Individual por Sucursal ($):</label>
            <input type="number" id="metaGlobal" value="10000" oninput="sincronizarMetaEnTiempoReal()">
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th style="width: 32%;">Punto de Venta / Asesores</th>
                <th style="width: 23%;">Venta ($)</th>
                <th style="width: 30%;">Avance Carrera</th>
                <th style="width: 15%; text-align: center;">%</th>
            </tr>
        </thead>
        <tbody id="tablaSucursales">
            <!-- Cargado Dinámicamente -->
        </tbody>
    </table>

    <div class="total-box">
        <span>TOTAL GLOBAL DEL DÍA:</span>
        <span class="amount" id="granTotal">$0.00</span>
    </div>
</div>

<!-- MODAL DE ADMINISTRACIÓN COMPLETO -->
<div class="modal-overlay" id="modalAdmin">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="adminTitulo">⚙️ Panel de Administración</h3>
            <button class="btn-close" onclick="cerrarAdmin()">✕</button>
        </div>
        
        <!-- SECCIÓN 1: PUNTOS DE VENTA -->
        <div class="admin-section">
            <h4>📍 Puntos de Venta Habilitados</h4>
            <div class="admin-list" id="listaAdminSucursales"></div>
            <div class="add-box">
                <input type="text" id="nuevoPuntoVenta" placeholder="Nombre de nueva sucursal...">
                <button class="btn btn-save" onclick="agregarPuntoVenta()">+ Agregar</button>
            </div>
        </div>

        <!-- SECCIÓN 2: SUB-ADMINISTRADORES (Solo visible para el Super Admin) -->
        <div class="admin-section" id="seccionSubAdmins" style="display: none;">
            <hr style="border: none; border-top: 1px dashed #cbd5e1; margin: 15px 0;">
            <h4>👥 Claves de Sub-Administradores</h4>
            <div class="admin-list" id="listaSubAdmins"></div>
            <div class="add-box">
                <input type="text" id="nuevaClaveSubAdmin" placeholder="Nueva clave de Sub-Admin...">
                <button class="btn btn-admin" onclick="agregarSubAdmin()">+ Crear Clave</button>
            </div>
        </div>
    </div>
</div>

<script>
    // CONFIGURACIÓN DE ROLES
    const CLAVE_SUPER_ADMIN = "SUPER123"; // Clave del Administrador Principal
    let clavesSubAdmin = ["SUB123"];     // Claves para Sub-administradores
    let rolActual = null;                // 'SUPER', 'SUB' o null

    // Lista por defecto
    let sucursales = [
        "RIO 1", "RIO 3", "RIO 5", "RIO 6", 
        "AMERICAS", "MONUMENTAL", "SAN LORENZO", 
        "SHOTA RIO", "PAPIS RIO", "TOSKARIO 1", 
        "TOSKARIO 2", "MIEL RIO", "COCOS"
    ];

    // Configuración Firebase Realtime Database
    const firebaseConfig = {
        apiKey: "TU_API_KEY",
        authDomain: "tu-proyecto.firebaseapp.com",
        databaseURL: "https://tu-proyecto-default-rtdb.firebaseio.com",
        projectId: "tu-proyecto",
        storageBucket: "tu-proyecto.appspot.com",
        messagingSenderId: "123456789",
        appId: "1:123456789:web:abcdef"
    };

    let db = null;
    if (firebaseConfig.apiKey !== "TU_API_KEY") {
        firebase.initializeApp(firebaseConfig);
        db = firebase.database();
        escucharFirebase();
    }

    document.getElementById('fechaRegistro').value = new Date().toISOString().slice(0, 10);

    // RENDERIZAR TABLA PRINCIPAL
    function cargarTabla() {
        const tbody = document.getElementById('tablaSucursales');
        tbody.innerHTML = '';

        sucursales.forEach((sucursal, index) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>
                    <div class="store-cell">
                        <img src="SHOTA.jpg" class="store-logo" alt="Shota Logo" onerror="this.onerror=null; this.src='SHOTA.png'; this.onerror=function(){this.outerHTML='<div class=\'logo-placeholder\'>SHOTA</div>';}">
                        <div class="store-info">
                            <span class="store-name">${sucursal}</span>
                            <input type="text" class="input-asesores" data-sucursal="${sucursal}" placeholder="👥 Asesor(es) asignados..." oninput="transmitirEscribiendo('${sucursal}', 'asesores', this.value)">
                        </div>
                    </div>
                </td>
                <td>
                    <input type="number" class="input-venta" data-sucursal="${sucursal}" placeholder="0.00" oninput="calcularTotales(); transmitirEscribiendo('${sucursal}', 'venta', this.value);">
                </td>
                <td>
                    <div class="progress-container">
                        <div class="progress-bar" id="bar-${index}"></div>
                    </div>
                </td>
                <td class="pct-text" id="pct-${index}">0%</td>
            `;
            tbody.appendChild(tr);
        });
        calcularTotales();
    }

    function calcularTotales() {
        const meta = parseFloat(document.getElementById('metaGlobal').value) || 1;
        const inputs = document.querySelectorAll('.input-venta');
        let sumaTotal = 0;

        inputs.forEach((input, index) => {
            const venta = parseFloat(input.value) || 0;
            sumaTotal += venta;

            let porcentaje = Math.min(Math.round((venta / meta) * 100), 100);
            
            const bar = document.getElementById(`bar-${index}`);
            const pct = document.getElementById(`pct-${index}`);
            if (bar && pct) {
                bar.style.width = `${porcentaje}%`;
                pct.innerText = `${porcentaje}%`;
            }
        });

        document.getElementById('granTotal').innerText = `$${sumaTotal.toLocaleString('es-MX', {minimumFractionDigits: 2})}`;
    }

    // TRANSMISIÓN EN TIEMPO REAL A OTROS PUNTOS DE VENTA
    function transmitirEscribiendo(sucursal, campo, valor) {
        if (!db) return;
        const fecha = document.getElementById('fechaRegistro').value;
        db.ref(`ventas_diarias/${fecha}/puntos/${sucursal}/${campo}`).set(valor);
    }

    function sincronizarMetaEnTiempoReal() {
        calcularTotales();
        if (!db) return;
        const fecha = document.getElementById('fechaRegistro').value;
        const meta = parseFloat(document.getElementById('metaGlobal').value) || 0;
        db.ref(`ventas_diarias/${fecha}/meta_global`).set(meta);
    }

    // GESTIÓN DE ROLES Y MODAL ADMIN
    function iniciarSesionAdmin() {
        const pass = prompt("Introduce tu Clave de Administrador o Sub-Admin:");
        if (pass === CLAVE_SUPER_ADMIN) {
            rolActual = 'SUPER';
            abrirModalAdmin();
        } else if (clavesSubAdmin.includes(pass)) {
            rolActual = 'SUB';
            abrirModalAdmin();
        } else if (pass !== null) {
            alert("❌ Clave incorrecta. Acceso denegado.");
        }
    }

    function abrirModalAdmin() {
        document.getElementById('modalAdmin').style.display = 'flex';
        document.getElementById('adminTitulo').innerText = rolActual === 'SUPER' ? "⚙️ Super Administrador" : "⚙️ Sub-Administrador";
        document.getElementById('seccionSubAdmins').style.display = rolActual === 'SUPER' ? 'block' : 'none';
        
        renderListaAdminSucursales();
        if (rolActual === 'SUPER') renderListaSubAdmins();
    }

    function cerrarAdmin() {
        document.getElementById('modalAdmin').style.display = 'none';
    }

    function renderListaAdminSucursales() {
        const container = document.getElementById('listaAdminSucursales');
        container.innerHTML = '';
        sucursales.forEach((sucursal, idx) => {
            const item = document.createElement('div');
            item.className = 'admin-item';
            item.innerHTML = `<span>${sucursal}</span><button class="btn-del" onclick="eliminarPuntoVenta(${idx})">Eliminar</button>`;
            container.appendChild(item);
        });
    }

    function renderListaSubAdmins() {
        const container = document.getElementById('listaSubAdmins');
        container.innerHTML = '';
        clavesSubAdmin.forEach((clave, idx) => {
            const item = document.createElement('div');
            item.className = 'admin-item';
            item.innerHTML = `<span>Clave: <strong>${clave}</strong></span><button class="btn-del" onclick="eliminarSubAdmin(${idx})">Revocar</button>`;
            container.appendChild(item);
        });
    }

    function agregarPuntoVenta() {
        const input = document.getElementById('nuevoPuntoVenta');
        const nombre = input.value.trim().toUpperCase();
        if (nombre && !sucursales.includes(nombre)) {
            sucursales.push(nombre);
            input.value = '';
            sincronizarConfiguracion();
        }
    }

    function eliminarPuntoVenta(index) {
        if (confirm(`¿Eliminar punto de venta "${sucursales[index]}"?`)) {
            sucursales.splice(index, 1);
            sincronizarConfiguracion();
        }
    }

    function agregarSubAdmin() {
        const input = document.getElementById('nuevaClaveSubAdmin');
        const clave = input.value.trim();
        if (clave && !clavesSubAdmin.includes(clave)) {
            clavesSubAdmin.push(clave);
            input.value = '';
            sincronizarConfiguracion();
        }
    }

    function eliminarSubAdmin(index) {
        if (confirm("¿Seguro que deseas revocar esta clave de Sub-Admin?")) {
            clavesSubAdmin.splice(index, 1);
            sincronizarConfiguracion();
        }
    }

    function sincronizarConfiguracion() {
        renderListaAdminSucursales();
        if (rolActual === 'SUPER') renderListaSubAdmins();
        cargarTabla();

        if (db) {
            db.ref('configuracion').set({
                sucursales: sucursales,
                sub_admins: clavesSubAdmin
            });
        }
    }

    // CONEXIÓN CONTINUA CON FIREBASE
    function escucharFirebase() {
        // Escuchar configuración global (Puntos de venta y Sub-admins)
        db.ref('configuracion').on('value', (snapshot) => {
            const config = snapshot.val();
            if (config) {
                if (config.sucursales) sucursales = config.sucursales;
                if (config.sub_admins) clavesSubAdmin = config.sub_admins;
                cargarTabla();
                cargarDatosFecha();
            }
        });
    }

    function cargarDatosFecha() {
        if (!db) return;
        const fecha = document.getElementById('fechaRegistro').value;

        db.ref(`ventas_diarias/${fecha}`).on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                if (data.meta_global) document.getElementById('metaGlobal').value = data.meta_global;
                
                if (data.puntos) {
                    Object.keys(data.puntos).forEach(sucursal => {
                        const inputVenta = document.querySelector(`.input-venta[data-sucursal="${sucursal}"]`);
                        const inputAsesores = document.querySelector(`.input-asesores[data-sucursal="${sucursal}"]`);
                        
                        if (inputVenta && document.activeElement !== inputVenta) {
                            inputVenta.value = data.puntos[sucursal].venta || '';
                        }
                        if (inputAsesores && document.activeElement !== inputAsesores) {
                            inputAsesores.value = data.puntos[sucursal].asesores || '';
                        }
                    });
                }
                calcularTotales();
            }
        });
    }

    // CAPTURA EN IMAGEN PNG
    function descargarComoImagen() {
        const elemento = document.getElementById('carreraVentas');
        const opciones = {
            scale: 2,
            useCORS: true,
            allowTaint: false,
            backgroundColor: "#ffffff",
            onclone: (docClonado) => {
                const origInputs = elemento.querySelectorAll('input');
                const cloneInputs = docClonado.querySelectorAll('input');
                origInputs.forEach((inp, idx) => {
                    if (cloneInputs[idx]) cloneInputs[idx].value = inp.value;
                });
            }
        };

        html2canvas(elemento, opciones).then(canvas => {
            const enlace = document.createElement('a');
            const fecha = document.getElementById('fechaRegistro').value;
            enlace.download = `Carrera_Ventas_Shota_${fecha}.png`;
            enlace.href = canvas.toDataURL('image/png');
            enlace.click();
        });
    }

    function guardarEnFirebase() {
        sincronizarMetaEnTiempoReal();
        alert("✅ Todos los puntos de venta están sincronizados correctamente.");
    }

    // Inicialización
    cargarTabla();
</script>

</body>
</html>
