<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHOTA STORE - Carrera de Ventas Anime</title>
    <!-- html2canvas para captura en imagen -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- Firebase SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@600;700&display=swap');

        * { box-sizing: border-box; }
        body {
            font-family: 'Rajdhani', sans-serif;
            background: #090d16;
            background-image: radial-gradient(#1e1b4b 1px, transparent 0);
            background-size: 24px 24px;
            color: #f1f5f9;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .action-bar {
            width: 100%;
            max-width: 1000px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 12px rgba(0, 0, 0, 0.5);
            transition: all 0.2s ease;
        }

        .btn:hover { transform: translateY(-2px); }
        .btn-download { background: linear-gradient(135deg, #0284c7, #2563eb); color: white; }
        .btn-save { background: linear-gradient(135deg, #059669, #10b981); color: white; }
        .btn-admin { background: linear-gradient(135deg, #d97706, #f59e0b); color: white; }

        .container {
            width: 100%;
            max-width: 1000px;
            background: #0f172a;
            border-radius: 16px;
            padding: 24px;
            border: 2px solid #3b82f6;
            box-shadow: 0 0 25px rgba(59, 130, 246, 0.2);
        }

        .header {
            text-align: center;
            background: linear-gradient(135deg, #1e1b4b, #0f172a);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid #6366f1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            box-shadow: inset 0 0 15px rgba(99, 102, 241, 0.3);
        }

        /* SVG Logo Shota integrado */
        .shota-badge {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #ec4899, #8b5cf6);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 1rem;
            color: white;
            box-shadow: 0 0 15px rgba(236, 72, 153, 0.5);
            border: 2px solid #ffffff;
            flex-shrink: 0;
        }

        .header-text h1 {
            margin: 0;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.6rem;
            text-transform: uppercase;
            background: linear-gradient(90deg, #38bdf8, #a855f7, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1.5px;
        }

        .header-text p { margin: 4px 0 0 0; color: #94a3b8; font-size: 0.95rem; font-weight: 600; }

        .date-bar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 15px;
        }

        .date-bar input {
            background: #1e293b;
            border: 1px solid #475569;
            color: #38bdf8;
            font-family: 'Orbitron', sans-serif;
            padding: 6px 12px;
            border-radius: 6px;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 8px;
            margin-bottom: 20px;
        }

        th {
            background-color: #1e293b;
            color: #38bdf8;
            font-family: 'Orbitron', sans-serif;
            text-align: left;
            padding: 12px;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 2px solid #334155;
        }

        td {
            background: #182234;
            padding: 10px 12px;
            vertical-align: middle;
        }

        td:first-child { border-radius: 8px 0 0 8px; }
        td:last-child { border-radius: 0 8px 8px 0; }

        .store-cell {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .store-logo-mini {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, #8b5cf6, #3b82f6);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.6rem;
            font-weight: 900;
            color: white;
            border: 1px solid #a855f7;
            flex-shrink: 0;
        }

        .store-info {
            display: flex;
            flex-direction: column;
            gap: 3px;
            width: 100%;
        }

        .store-name {
            font-family: 'Orbitron', sans-serif;
            font-weight: 800;
            font-size: 0.95rem;
            color: #f8fafc;
        }

        .input-dark {
            background: #0f172a;
            border: 1px solid #334155;
            color: #f1f5f9;
            padding: 6px 8px;
            border-radius: 6px;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 600;
            font-size: 0.85rem;
            width: 100%;
        }

        .input-dark:focus { border-color: #38bdf8; outline: none; }

        .progress-container {
            width: 100%;
            background-color: #0f172a;
            border-radius: 8px;
            height: 20px;
            overflow: hidden;
            border: 1px solid #334155;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #8b5cf6, #ec4899, #10b981);
            width: 0%;
            transition: width 0.4s ease;
            box-shadow: 0 0 10px rgba(236, 72, 153, 0.5);
        }

        .pct-text {
            font-family: 'Orbitron', sans-serif;
            font-weight: 800;
            font-size: 0.85rem;
            color: #38bdf8;
            text-align: center;
        }

        .total-box {
            background: linear-gradient(135deg, #1e1b4b, #0f172a);
            border: 2px solid #a855f7;
            color: white;
            padding: 16px 20px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
        }

        .total-box span.amount {
            color: #ec4899;
            font-size: 1.4rem;
            text-shadow: 0 0 10px rgba(236, 72, 153, 0.5);
        }

        /* MODAL ADMIN */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(9, 13, 22, 0.9);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: #0f172a;
            border: 2px solid #a855f7;
            padding: 24px;
            border-radius: 12px;
            width: 90%;
            max-width: 550px;
            color: #f1f5f9;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .admin-list {
            max-height: 180px;
            overflow-y: auto;
            border: 1px solid #334155;
            border-radius: 6px;
            padding: 8px;
            margin-bottom: 10px;
            background: #182234;
        }

        .admin-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px;
            border-bottom: 1px solid #1e293b;
        }

        .btn-del {
            background: #ef4444; color: white; border: none;
            border-radius: 4px; padding: 4px 8px; font-size: 0.75rem; cursor: pointer;
        }
    </style>
</head>
<body>

<div class="action-bar">
    <button class="btn btn-admin" onclick="iniciarSesionAdmin()">
        🔑 Acceso Admin / Unlock
    </button>
    <div>
        <button class="btn btn-save" onclick="sincronizarDatos()">
            ⚡ Sincronizar
        </button>
        <button class="btn btn-download" onclick="descargarComoImagen()">
            📸 Captura PNG
        </button>
    </div>
</div>

<div class="container" id="carreraVentas">
    <div class="header">
        <div class="shota-badge">SHOTA</div>
        <div class="header-text">
            <h1>⛩️ TORNEO DE VENTAS - SHOTA STORE ⛩️</h1>
            <p>Clasificación General y Nivel de Poder de Sucursales</p>
        </div>
    </div>

    <div class="date-bar">
        <label style="font-family: 'Orbitron'; font-size: 0.8rem; margin-right: 10px; align-self: center;">📅 FECHA:</label>
        <input type="date" id="fechaRegistro" onchange="cargarDatosFecha()">
    </div>

    <table>
        <thead>
            <tr>
                <th style="width: 32%;">Punto de Venta / Asesores / Anime Top</th>
                <th style="width: 18%;">Meta Día ($)</th>
                <th style="width: 18%;">Venta Real ($)</th>
                <th style="width: 22%;">Progreso</th>
                <th style="width: 10%; text-align: center;">%</th>
            </tr>
        </thead>
        <tbody id="tablaSucursales">
            <!-- Cargado Dinámicamente -->
        </tbody>
    </table>

    <div class="total-box">
        <span>⚡ TOTAL ACUMULADO GLOBAL:</span>
        <span class="amount" id="granTotal">🔒 OCULTO (SOLO ADMINS)</span>
    </div>
</div>

<!-- MODAL ADMIN -->
<div class="modal-overlay" id="modalAdmin">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="adminTitulo" style="margin:0; font-family:'Orbitron'; color:#a855f7;">⚙️ Panel Admin</h3>
            <button style="background:none; border:none; color:white; font-size:1.2rem; cursor:pointer;" onclick="cerrarAdmin()">✕</button>
        </div>
        
        <div>
            <h4 style="font-family:'Orbitron'; font-size:0.85rem; color:#38bdf8;">📍 Sucursales Activas</h4>
            <div class="admin-list" id="listaAdminSucursales"></div>
            <div style="display:flex; gap:8px;">
                <input type="text" id="nuevoPuntoVenta" class="input-dark" placeholder="Nombre de nueva sucursal...">
                <button class="btn btn-save" onclick="agregarPuntoVenta()">+ Agregar</button>
            </div>
        </div>

        <div id="seccionSubAdmins" style="display:none; margin-top:15px;">
            <hr style="border:none; border-top:1px dashed #334155; margin:15px 0;">
            <h4 style="font-family:'Orbitron'; font-size:0.85rem; color:#ec4899;">👥 Claves Sub-Administradores</h4>
            <div class="admin-list" id="listaSubAdmins"></div>
            <div style="display:flex; gap:8px;">
                <input type="text" id="nuevaClaveSubAdmin" class="input-dark" placeholder="Nueva clave Sub-Admin...">
                <button class="btn btn-admin" onclick="agregarSubAdmin()">+ Crear</button>
            </div>
        </div>
    </div>
</div>

<script>
    const CLAVE_SUPER_ADMIN = "SUPER123";
    let clavesSubAdmin = ["SUB123"];
    let esAdmin = false; // Indica si se han desbloqueado las métricas ocultas

    let sucursales = [
        "RIO 1", "RIO 3", "RIO 5", "RIO 6", 
        "AMERICAS", "MONUMENTAL", "SAN LORENZO", 
        "SHOTA RIO", "PAPIS RIO", "TOSKARIO 1", 
        "TOSKARIO 2", "MIEL RIO", "COCOS"
    ];

    // Configuración Firebase
    const firebaseConfig = {
        apiKey: "TU_API_KEY",
        authDomain: "tu-proyecto.firebaseapp.com",
        databaseURL: "https://tu-proyecto-default-rtdb.firebaseio.com",
        projectId: "tu-proyecto",
        storageBucket: "tu-proyecto.appspot.com",
        messagingSenderId: "123456789",
        appId: "1:123456789:web:abcdef"
    };

    let db = null;
    if (firebaseConfig.apiKey !== "TU_API_KEY") {
        firebase.initializeApp(firebaseConfig);
        db = firebase.database();
        escucharFirebase();
    }

    document.getElementById('fechaRegistro').value = new Date().toISOString().slice(0, 10);

    function cargarTabla() {
        const tbody = document.getElementById('tablaSucursales');
        tbody.innerHTML = '';

        sucursales.forEach((sucursal, index) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>
                    <div class="store-cell">
                        <div class="store-logo-mini">SHOTA</div>
                        <div class="store-info">
                            <span class="store-name">${sucursal}</span>
                            <input type="text" class="input-dark input-asesores" data-sucursal="${sucursal}" placeholder="👥 Asesor(es)..." oninput="transmitirField('${sucursal}', 'asesores', this.value)">
                            <input type="text" class="input-dark input-anime" data-sucursal="${sucursal}" placeholder="🔥 Anime destacado (Ej: Naruto)..." oninput="transmitirField('${sucursal}', 'anime', this.value)">
                        </div>
                    </div>
                </td>
                <td>
                    <input type="number" class="input-dark input-meta" data-sucursal="${sucursal}" placeholder="Meta $" oninput="calcularTotales(); transmitirField('${sucursal}', 'meta', this.value);">
                </td>
                <td>
                    <input type="number" class="input-dark input-venta" data-sucursal="${sucursal}" placeholder="0.00" oninput="calcularTotales(); transmitirField('${sucursal}', 'venta', this.value);">
                </td>
                <td>
                    <div class="progress-container">
                        <div class="progress-bar" id="bar-${index}"></div>
                    </div>
                </td>
                <td class="pct-text" id="pct-${index}">0%</td>
            `;
            tbody.appendChild(tr);
        });
        calcularTotales();
    }

    function calcularTotales() {
        const inputsVenta = document.querySelectorAll('.input-venta');
        const inputsMeta = document.querySelectorAll('.input-meta');
        let sumaTotalVentas = 0;

        inputsVenta.forEach((inputVenta, index) => {
            const venta = parseFloat(inputVenta.value) || 0;
            const metaInput = inputsMeta[index];
            const meta = (metaInput && parseFloat(metaInput.value)) ? parseFloat(metaInput.value) : 10000; // Meta por defecto

            sumaTotalVentas += venta;
            let porcentaje = Math.min(Math.round((venta / meta) * 100), 100);
            
            const bar = document.getElementById(`bar-${index}`);
            const pct = document.getElementById(`pct-${index}`);
            if (bar && pct) {
                bar.style.width = `${porcentaje}%`;
                pct.innerText = `${porcentaje}%`;
            }
        });

        // RESTRICCIÓN DE VISIBILIDAD DE TOTALES
        const elemGranTotal = document.getElementById('granTotal');
        if (esAdmin) {
            elemGranTotal.innerText = `$${sumaTotalVentas.toLocaleString('es-MX', {minimumFractionDigits: 2})}`;
        } else {
            elemGranTotal.innerText = "🔒 OCULTO (SOLO ADMINS)";
        }
    }

    function transmitirField(sucursal, campo, valor) {
        if (!db) return;
        const fecha = document.getElementById('fechaRegistro').value;
        db.ref(`ventas_diarias/${fecha}/puntos/${sucursal}/${campo}`).set(valor);
    }

    function iniciarSesionAdmin() {
        const pass = prompt("Introduce Clave de Administrador o Sub-Admin:");
        if (pass === CLAVE_SUPER_ADMIN) {
            esAdmin = true;
            abrirModalAdmin('SUPER');
        } else if (clavesSubAdmin.includes(pass)) {
            esAdmin = true;
            abrirModalAdmin('SUB');
        } else if (pass !== null) {
            alert("❌ Clave incorrecta.");
        }
        calcularTotales();
    }

    function abrirModalAdmin(rol) {
        document.getElementById('modalAdmin').style.display = 'flex';
        document.getElementById('seccionSubAdmins').style.display = rol === 'SUPER' ? 'block' : 'none';
        renderListaAdminSucursales();
        if (rol === 'SUPER') renderListaSubAdmins();
    }

    function cerrarAdmin() { document.getElementById('modalAdmin').style.display = 'none'; }

    function renderListaAdminSucursales() {
        const container = document.getElementById('listaAdminSucursales');
        container.innerHTML = '';
        sucursales.forEach((sucursal, idx) => {
            container.innerHTML += `<div class="admin-item"><span>${sucursal}</span><button class="btn-del" onclick="eliminarPuntoVenta(${idx})">Eliminar</button></div>`;
        });
    }

    function renderListaSubAdmins() {
        const container = document.getElementById('listaSubAdmins');
        container.innerHTML = '';
        clavesSubAdmin.forEach((clave, idx) => {
            container.innerHTML += `<div class="admin-item"><span>Clave: <strong>${clave}</strong></span><button class="btn-del" onclick="eliminarSubAdmin(${idx})">Eliminar</button></div>`;
        });
    }

    function agregarPuntoVenta() {
        const input = document.getElementById('nuevoPuntoVenta');
        const nombre = input.value.trim().toUpperCase();
        if (nombre && !sucursales.includes(nombre)) {
            sucursales.push(nombre);
            input.value = '';
            sincronizarConfiguracion();
        }
    }

    function eliminarPuntoVenta(index) {
        sucursales.splice(index, 1);
        sincronizarConfiguracion();
    }

    function agregarSubAdmin() {
        const input = document.getElementById('nuevaClaveSubAdmin');
        const clave = input.value.trim();
        if (clave && !clavesSubAdmin.includes(clave)) {
            clavesSubAdmin.push(clave);
            input.value = '';
            sincronizarConfiguracion();
        }
    }

    function eliminarSubAdmin(index) {
        clavesSubAdmin.splice(index, 1);
        sincronizarConfiguracion();
    }

    function sincronizarConfiguracion() {
        renderListaAdminSucursales();
        renderListaSubAdmins();
        cargarTabla();
        if (db) {
            db.ref('configuracion').set({ sucursales, sub_admins: clavesSubAdmin });
        }
    }

    function escucharFirebase() {
        db.ref('configuracion').on('value', (snapshot) => {
            const config = snapshot.val();
            if (config) {
                if (config.sucursales) sucursales = config.sucursales;
                if (config.sub_admins) clavesSubAdmin = config.sub_admins;
                cargarTabla();
                cargarDatosFecha();
            }
        });
    }

    function cargarDatosFecha() {
        if (!db) return;
        const fecha = document.getElementById('fechaRegistro').value;

        db.ref(`ventas_diarias/${fecha}/puntos`).on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                Object.keys(data).forEach(sucursal => {
                    const inputVenta = document.querySelector(`.input-venta[data-sucursal="${sucursal}"]`);
                    const inputMeta = document.querySelector(`.input-meta[data-sucursal="${sucursal}"]`);
                    const inputAsesores = document.querySelector(`.input-asesores[data-sucursal="${sucursal}"]`);
                    const inputAnime = document.querySelector(`.input-anime[data-sucursal="${sucursal}"]`);
                    
                    if (inputVenta && document.activeElement !== inputVenta) inputVenta.value = data[sucursal].venta || '';
                    if (inputMeta && document.activeElement !== inputMeta) inputMeta.value = data[sucursal].meta || '';
                    if (inputAsesores && document.activeElement !== inputAsesores) inputAsesores.value = data[sucursal].asesores || '';
                    if (inputAnime && document.activeElement !== inputAnime) inputAnime.value = data[sucursal].anime || '';
                });
                calcularTotales();
            }
        });
    }

    function descargarComoImagen() {
        const elemento = document.getElementById('carreraVentas');
        html2canvas(elemento, {
            scale: 2,
            backgroundColor: "#090d16",
            onclone: (docClonado) => {
                const origInputs = elemento.querySelectorAll('input');
                const cloneInputs = docClonado.querySelectorAll('input');
                origInputs.forEach((inp, idx) => {
                    if (cloneInputs[idx]) cloneInputs[idx].value = inp.value;
                });
            }
        }).then(canvas => {
            const enlace = document.createElement('a');
            const fecha = document.getElementById('fechaRegistro').value;
            enlace.download = `Torneo_ShotaStore_${fecha}.png`;
            enlace.href = canvas.toDataURL('image/png');
            enlace.click();
        });
    }

    function sincronizarDatos() { alert("⚡ Datos sincronizados en la red."); }

    cargarTabla();
</script>

</body>
</html>
